name: Lint Workflows

on:
  push:
    paths: [ '.github/workflows/**', 'contracts/**/*.rs', 'scripts/**' ]
  pull_request:
    paths: [ '.github/workflows/**', 'contracts/**/*.rs', 'scripts/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_CHECKSUM: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          bash <(curl -s --retry 3 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest
          ./actionlint -color .github/workflows/*.yml

      - name: Detect orphaned .rs files
        run: python scripts/check_orphan_modules.py

  python_lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.9.10
      - name: Check style and lint (ruff check)
        run: make python-lint
      - name: Check formatting (ruff format)
        run: make python-fmt-check