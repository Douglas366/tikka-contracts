repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        name: ruff lint (scripts/)
        args: ["--fix"]
        files: ^scripts/.*\.py$
      - id: ruff-format
        name: ruff format (scripts/)
        files: ^scripts/.*\.py$

  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
      - id: check-orphan-modules
        name: check orphan modules
        entry: python3 scripts/check_orphan_modules.py
        language: system
        pass_filenames: false
      - id: prettier-oracle
        name: prettier oracle
        entry: bash -lc 'cd oracle && npx prettier --check "**/*.{js,jsx,ts,tsx,json,md}"'
        language: system
        pass_filenames: false
      - id: eslint-oracle
        name: eslint oracle
        entry: bash -lc 'cd oracle && npm run lint'
        language: system
        pass_filenames: false
